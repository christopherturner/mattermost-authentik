version: 2
updates:
  # Maintain dependencies for GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  # Maintain Go dependencies for the server plugin
  - package-ecosystem: "gomod"
    directory: "/server"
    schedule:
      interval: "weekly"
    groups:
      go-dependencies:
        patterns:
          - "*"

  # Maintain npm dependencies for the webapp SPA
  - package-ecosystem: "npm"
    directory: "/webapp"
    schedule:
      interval: "weekly"
    groups:
      npm-dependencies:
        patterns:
          - "*"
    ignore:
      # Babel 8 packages require @babel/core 8 which is not yet stable
      - dependency-name: "@babel/*"
        update-types: ["version-update:semver-major"]
