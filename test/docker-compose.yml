services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: mmuser
      POSTGRES_PASSWORD: mmuser_password
      POSTGRES_DB: mattermost
    volumes:
      - mm_postgres_data:/var/lib/postgresql/data

  mock-authentik:
    build:
      context: ./mock-authentik
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "9000:9000"

  mattermost:
    image: mattermost/mattermost-team-edition:${MM_VERSION:-12.0.1}
    restart: unless-stopped
    ports:
      - "8065:8065"
    depends_on:
      - postgres
      - mock-authentik
    extra_hosts:
      - "localhost:host-gateway"
      - "host.docker.internal:host-gateway"
    environment:
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: postgres://mmuser:mmuser_password@postgres:5432/mattermost?sslmode=disable&connect_timeout=10
      MM_SERVICESETTINGS_SITEURL: http://localhost:8065
      MM_SERVICESETTINGS_ENABLELOCALMODE: "true"
      MM_SERVICESETTINGS_LOCALMODESOCKETLOCATION: /var/tmp/mattermost_local.socket
      MM_PLUGINSETTINGS_ENABLE: "true"
      MM_PLUGINSETTINGS_ENABLEUPLOADS: "true"
      MM_LOGSETTINGS_CONSOLELEVEL: DEBUG
    volumes:
      - ../dist:/dist:ro
      - mm_data:/mattermost/data

volumes:
  mm_postgres_data:
  mm_data:
