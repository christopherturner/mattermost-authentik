services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: mmuser
      POSTGRES_PASSWORD: mmuser_password
      POSTGRES_DB: mattermost
    volumes:
      - ./init-authentik-db.sql:/docker-entrypoint-initdb.d/init-authentik-db.sql:ro
      - mm_postgres_real_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  authentik-server:
    image: ghcr.io/goauthentik/server:2026.8.4
    restart: unless-stopped
    command: server
    environment:
      AUTHENTIK_SECRET_KEY: "authentik-test-secret-key-1234567890"
      AUTHENTIK_BOOTSTRAP_TOKEN: "ak-bootstrap-token-1234567890"
      AUTHENTIK_BOOTSTRAP_PASSWORD: "AkAdminPassword123!"
      AUTHENTIK_BOOTSTRAP_EMAIL: "akadmin@example.com"
      AUTHENTIK_REDIS__HOST: "redis"
      AUTHENTIK_POSTGRESQL__HOST: "postgres"
      AUTHENTIK_POSTGRESQL__NAME: "authentik"
      AUTHENTIK_POSTGRESQL__USER: "akuser"
      AUTHENTIK_POSTGRESQL__PASSWORD: "akuser_password"
      AUTHENTIK_DISABLE_STARTUP_ANALYTICS: "true"
      AUTHENTIK_DISABLE_UPDATE_CHECK: "true"
      AUTHENTIK_AVATARS: "none"
    ports:
      - "9000:9000"
    depends_on:
      - postgres
      - redis

  authentik-worker:
    image: ghcr.io/goauthentik/server:2026.8.4
    restart: unless-stopped
    command: worker
    environment:
      AUTHENTIK_SECRET_KEY: "authentik-test-secret-key-1234567890"
      AUTHENTIK_BOOTSTRAP_TOKEN: "ak-bootstrap-token-1234567890"
      AUTHENTIK_REDIS__HOST: "redis"
      AUTHENTIK_POSTGRESQL__HOST: "postgres"
      AUTHENTIK_POSTGRESQL__NAME: "authentik"
      AUTHENTIK_POSTGRESQL__USER: "akuser"
      AUTHENTIK_POSTGRESQL__PASSWORD: "akuser_password"
      AUTHENTIK_DISABLE_STARTUP_ANALYTICS: "true"
      AUTHENTIK_DISABLE_UPDATE_CHECK: "true"
      AUTHENTIK_AVATARS: "none"
    depends_on:
      - postgres
      - redis

  mattermost:
    image: mattermost/mattermost-team-edition:latest
    restart: unless-stopped
    ports:
      - "8065:8065"
    depends_on:
      - postgres
      - authentik-server
    extra_hosts:
      - "localhost:host-gateway"
      - "host.docker.internal:host-gateway"
    environment:
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: postgres://mmuser:mmuser_password@postgres:5432/mattermost?sslmode=disable&connect_timeout=10
      MM_SERVICESETTINGS_SITEURL: http://localhost:8065
      MM_SERVICESETTINGS_ENABLELOCALMODE: "true"
      MM_SERVICESETTINGS_LOCALMODESOCKETLOCATION: /var/tmp/mattermost_local.socket
      MM_PLUGINSETTINGS_ENABLE: "true"
      MM_PLUGINSETTINGS_ENABLEUPLOADS: "true"
      MM_LOGSETTINGS_CONSOLELEVEL: DEBUG
    volumes:
      - ../dist:/dist:ro
      - mm_real_data:/mattermost/data

volumes:
  mm_postgres_real_data:
  mm_real_data:
